<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrgShift - Setup</title>
  <link rel="stylesheet" href="/static/style.css?v=38" />
</head>
<body class="product-page">
<header class="topbar">
  <div class="topbar-left">
    <a class="logo brand-logo" href="/" aria-label="OrgShift setup"><img src="/static/assets/orgshift-logo.png" alt=""><span>OrgShift</span></a>
    <span class="subtitle">Setup</span>
  </div>
  <div class="topbar-center">
    <div id="setup-banner" class="auth-status"><span class="dot"></span> Target org session</div>
  </div>
  <div class="topbar-right">
    <a href="/workspace" class="btn btn-secondary nav-btn">Workspace</a>
    <a href="/pipeline" class="btn btn-secondary nav-btn">Pipeline Designer</a>
  </div>
</header>

<main class="product-shell">
  <section class="product-hero">
    <p class="product-kicker">Setup</p>
    <h1>Target connection</h1>
    <p>The login URL and session ID are saved from Open Setup.bat before the server starts. Place source CSVs in Input Files, using one folder per object API name.</p>
  </section>
  <section class="product-card setup-card tone-blue">
    <div id="setup-target" class="setup-paths"></div>
    <div class="setup-actions">
      <button id="setup-restart" class="btn btn-secondary" type="button">Restart Python Server</button>
      <button id="setup-stop" class="btn btn-danger" type="button">Stop Python Server</button>
      <a class="btn btn-secondary" href="/workspace">Open Workspace</a>
    </div>
    <div id="setup-status" class="setup-status">Loading current setup…</div>
    <div id="setup-paths" class="setup-paths"></div>
  </section>
</main>
<script>
async function loadSetup() {
  const status = document.getElementById('setup-status');
  try {
    const response = await fetch('/api/setup', { cache: 'no-store' });
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'Failed to load setup');
    }
    const targetBox = document.getElementById('setup-target');
    targetBox.innerHTML = [
      `Login URL: ${data.TARGET_SF_LOGIN_URL || 'Not set'}`,
      `Session: ${data.TARGET_SF_SESSION_ID_MASKED || 'Not set'}`,
    ].map(line => `<div>${line}</div>`).join('');
    const banner = document.getElementById('setup-banner');
    banner.className = data.running ? 'auth-status ok' : 'auth-status';
    banner.innerHTML = `<span class="dot"></span> ${data.running ? 'Python server is running' : 'Python server is stopped'}`;
    status.className = 'setup-status ok';
    status.textContent = data.message || (data.running ? `Server running on port ${data.port}` : 'Server is not running.');
    const pathBox = document.getElementById('setup-paths');
    const folders = data.folders || {};
    pathBox.innerHTML = [
      folders.input && `Input Files: ${folders.input}`,
      folders.pre && `Pre Validate Result: ${folders.pre}`,
      folders.migration && `Migration Result: ${folders.migration}`,
      folders.post && `Post Validate Result: ${folders.post}`,
      folders.temp && `Temp Files: ${folders.temp}`,
      folders.engine && `ETL Engine: ${folders.engine}`,
    ].filter(Boolean).map(line => `<div>${line}</div>`).join('');
  } catch (error) {
    status.className = 'setup-status err';
    status.textContent = error.message || 'Failed to load setup';
  }
}

async function postSetup(url) {
  const status = document.getElementById('setup-status');
  status.className = 'setup-status';
  status.textContent = 'Working…';
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({}),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.error) {
    throw new Error(data.error || 'Request failed');
  }
  return data;
}

document.getElementById('setup-stop').addEventListener('click', async () => {
  const status = document.getElementById('setup-status');
  try {
    const data = await postSetup('/api/setup/stop');
    status.className = 'setup-status';
    status.textContent = data.message || 'Python server is stopping…';
    for (let attempt = 0; attempt < 15; attempt += 1) {
      await new Promise(resolve => setTimeout(resolve, 1000));
      try {
        await fetch('/api/setup', { cache: 'no-store' });
      } catch (error) {
        status.className = 'setup-status ok';
        status.textContent = 'Python server is stopped.';
        const banner = document.getElementById('setup-banner');
        banner.className = 'auth-status';
        banner.innerHTML = '<span class="dot"></span> Python server is stopped';
        return;
      }
    }
    status.className = 'setup-status err';
    status.textContent = 'Stop was requested, but the server is still running.';
  } catch (error) {
    status.className = 'setup-status err';
    status.textContent = error.message;
  }
});

document.getElementById('setup-restart').addEventListener('click', async () => {
  const status = document.getElementById('setup-status');
  try {
    const data = await postSetup('/api/setup/restart');
    status.className = 'setup-status';
    status.textContent = data.message || 'Python server is restarting…';
    for (let attempt = 0; attempt < 20; attempt += 1) {
      await new Promise(resolve => setTimeout(resolve, 2000));
      try {
        const response = await fetch('/api/setup', { cache: 'no-store' });
        if (response.ok) {
          await loadSetup();
          return;
        }
      } catch (error) {
        status.textContent = 'Python server is restarting…';
      }
    }
    status.className = 'setup-status err';
    status.textContent = 'Restart was requested, but the server did not come back. Run Open Setup.bat.';
  } catch (error) {
    status.className = 'setup-status err';
    status.textContent = error.message === 'Failed to fetch'
      ? 'The server is stopped, so this page cannot restart it. Run Open Setup.bat.'
      : error.message;
  }
});

loadSetup();
</script>
</body>
</html>
